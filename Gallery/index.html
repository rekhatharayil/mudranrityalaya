  <script>
    (function () {
      var links = Array.prototype.slice.call(document.querySelectorAll('#gallery a'));
      var box = document.getElementById('lightbox');
      var img = box.querySelector('img');
      var current = 0;
      function show(i) {
        current = (i + links.length) % links.length;
        img.src = links[current].href;
        img.alt = links[current].querySelector('img').alt;
        box.classList.add('open');
      }
      function close() { box.classList.remove('open'); img.src = ''; }
      links.forEach(function (a, i) {
        a.addEventListener('click', function (e) { e.preventDefault(); show(i); });
      });
      box.querySelector('.lb-close').onclick = close;
      box.querySelector('.lb-prev').onclick = function () { show(current - 1); };
      box.querySelector('.lb-next').onclick = function () { show(current + 1); };
      box.addEventListener('click', function (e) { if (e.target === box) close(); });
      document.addEventListener('keydown', function (e) {
        if (!box.classList.contains('open')) return;
        if (e.key === 'Escape') close();
        if (e.key === 'ArrowLeft') show(current - 1);
        if (e.key === 'ArrowRight') show(current + 1);
      });
    })();
  </script>
